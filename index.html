<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Velo — M1 feel prototype</title>
  </head>
  <body>
    <div id="app">
      <canvas id="view"></canvas>
      <div id="hud"></div>
      <!-- Always visible, outside the panel: pressing H to hide the sliders
           must not also hide how you change level or what the keys are. -->
      <div id="levelbar"></div>
      <div id="legend"></div>
      <!-- The leaderboard. Also outside the panel: it is where you stand and
           which ghost you are racing, which is navigation, not tuning. -->
      <div id="board"></div>
      <!-- The end-of-level screen. On a FINISH only: dying is the common case
           and already has instant restart, and a panel in front of that would
           ruin the loop. Enter goes onward, R retries, Escape closes. -->
      <div id="results" class="hidden"></div>
      <!-- The level chooser: a picture of every level, its measured difficulty
           and your best time on it. Opened with C, and never by [ or ] — those
           step levels instantly and nothing is allowed to slow that down. -->
      <div id="chooser" class="hidden"></div>
      <!-- Touch controls. Large zones, never joysticks: the sim takes a
           BITMASK, so a stick would be a four-way pad wearing a costume and
           promising a partial throttle the physics does not have. Hidden unless
           the primary pointer is coarse, or ?touch=1 says otherwise. -->
      <div id="touch" class="hidden"></div>
      <!-- Live-tune notifications. A bike that changes under a player who is
           concentrating must SAY so, or they conclude they lost their touch. -->
      <div id="toast"></div>
      <aside id="panel"></aside>
    </div>
    <script type="module" src="/src/client/main.ts"></script>
  </body>
</html>
