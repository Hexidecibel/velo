<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Velo — M1 feel prototype</title>
  </head>
  <body>
    <div id="app">
      <canvas id="view"></canvas>
      <div id="hud"></div>
      <!-- Always visible, outside the panel: pressing H to hide the sliders
           must not also hide how you change level or what the keys are. -->
      <div id="levelbar"></div>
      <div id="legend"></div>
      <!-- Live-tune notifications. A bike that changes under a player who is
           concentrating must SAY so, or they conclude they lost their touch. -->
      <div id="toast"></div>
      <aside id="panel"></aside>
    </div>
    <script type="module" src="/src/client/main.ts"></script>
  </body>
</html>
