<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- `viewport-fit=cover` paints the game under a notch and a home
         indicator; touch.ts reads env(safe-area-inset-*) off a probe element so
         the pads stay out from under them. `user-scalable=no` is the belt to
         `touch-action: none`'s braces — a browser pinch-zoom on a fixed page
         leaves the player scrolled into a corner with no way back, and this game
         has a pinch of its own. -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <!-- BROWSER CHROME IS ABOUT A QUARTER OF AN ANDROID PHONE IN LANDSCAPE, and
         `display: standalone` in the manifest is the honest way to get it back:
         add to home screen, and the game opens with no URL bar at all. The
         Fullscreen API is the other way and it is OFFERED on a pad rather than
         taken on load — a game that grabs the screen when it loads is hostile,
         and on an iPhone the API does not exist to grab it with. Both are
         optional: the layout is correct with the chrome still there. -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#0d0b1a" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Velo" />
    <link rel="apple-touch-icon" href="/icon-180.png" />
    <link rel="icon" href="/icon-192.png" sizes="192x192" />
    <title>Velo — M1 feel prototype</title>
  </head>
  <body>
    <div id="app">
      <canvas id="view"></canvas>
      <div id="hud"></div>
      <!-- Always visible, outside the panel: pressing H to hide the sliders
           must not also hide how you change level or what the keys are. -->
      <div id="levelbar"></div>
      <div id="legend"></div>
      <!-- The leaderboard. Also outside the panel: it is where you stand and
           which ghost you are racing, which is navigation, not tuning. -->
      <div id="board"></div>
      <!-- The end-of-level screen. On a FINISH only: dying is the common case
           and already has instant restart, and a panel in front of that would
           ruin the loop. Enter goes onward, R retries, Escape closes. -->
      <div id="results" class="hidden"></div>
      <!-- The level chooser: a picture of every level, its measured difficulty
           and your best time on it. Opened with C, and never by [ or ] — those
           step levels instantly and nothing is allowed to slow that down. -->
      <div id="chooser" class="hidden"></div>
      <!-- The customiser: six bike silhouettes, ten liveries, and what the
           rider is wearing. Every one of them rides IDENTICALLY — same spec,
           same colliders, one spec hash — so nothing in here can change a time
           or stop one counting. Opened with Y. -->
      <div id="look" class="hidden"></div>
      <!-- Cross-device identity: a QR that makes another device the same
           player. NOT a login — there is nothing to sign in to. It solves the
           one problem that touch controls created: identity lives in one
           browser's localStorage, so picking up your phone made you somebody
           else. -->
      <div id="claim" class="hidden"></div>
      <!-- Touch controls. Large zones, never joysticks: the sim takes a
           BITMASK, so a stick would be a four-way pad wearing a costume and
           promising a partial throttle the physics does not have. Hidden unless
           the primary pointer is coarse, or ?touch=1 says otherwise. -->
      <div id="touch" class="hidden"></div>
      <!-- Live-tune notifications. A bike that changes under a player who is
           concentrating must SAY so, or they conclude they lost their touch. -->
      <div id="toast"></div>
      <aside id="panel"></aside>
      <!-- The level editor. A sidebar rather than a screen, because the whole
           point is that you are editing the level you are looking at: Q freezes
           the sim and hands you the handles, Q again rides what you drew. The
           canvas keeps the rest of the window. -->
      <aside id="editor" class="hidden"></aside>
    </div>
    <script type="module" src="/src/client/main.ts"></script>
  </body>
</html>
